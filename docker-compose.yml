services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: posmart_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: posmart_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d posmart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service (Go Gin)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: posmart_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_NAME=posmart_db
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - JWT_SECRET=your_super_secret_key_here
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Service (Vite React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: posmart_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
